name: cardinal_cli
description: Official CLI tool for bootstrapping and managing Cardinal Framework projects.
version: 0.2.0
repository: https://github.com/alomia/cardinal_cli
homepage: https://github.com/alomia/cardinal_cli
issue_tracker: https://github.com/alomia/cardinal_cli/issues

environment:
  sdk: ^3.10.1

topics:
  - cli
  - framework
  - developer
  - code-generation

executables:
  cardinal: cardinal_cli

# Add regular dependencies here.
dependencies:
  cardinal: ^0.2.0
  mason_logger: ^0.3.3
  mustache_template: ^2.0.2
  path: ^1.9.1
  recase: ^4.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
